     OPTION B — embed the calendar in the report instead of linking out.

     This is the snippet you sent, cleaned up. It puts the booking

     THREE THINGS TO KNOW BEFORE USING IT:

     1. form_embed.js must load ONCE per page. If the report step

        multiple embeds on one page distinct. If you ever put two
        widgets on the same page, they need different ids.
