    }, 150);
  });
  root.querySelectorAll(".rise").forEach(function (el, i) { el.style.animationDelay = (i * 0.08) + "s"; });

  /* ---------- tooltips ---------- */
  var tip = document.getElementById("afr-tip");
  function showTip(e) { var t = e.target.closest("[data-tip]"); if (!t) return; tip.textContent = t.getAttribute("data-tip"); tip.style.opacity = 1; moveTip(e); }
  function moveTip(e) { var x = e.clientX + 14, y = e.clientY + 14; if (x + 270 > window.innerWidth) x = e.clientX - 270; tip.style.left = x + "px"; tip.style.top = y + "px"; }
  root.addEventListener("mouseover", showTip);
  root.addEventListener("mousemove", function (e) { if (tip.style.opacity == 1) moveTip(e); });
  root.addEventListener("mouseout", function (e) { if (e.target.closest("[data-tip]")) tip.style.opacity = 0; });

  /* ---------- actions ---------- */
  document.getElementById("afr-print").addEventListener("click", function () { var d = root.querySelector("details.method"); if (d) d.open = true; window.print(); });
  document.getElementById("afr-copy").addEventListener("click", function () {
    var url = window.location.href, lbl = document.getElementById("afr-copy-lbl");
    function done() { lbl.textContent = "Link copied"; setTimeout(function () { lbl.textContent = "Copy link"; }, 2000); }
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () { window.prompt("Copy this link:", url); });
    else window.prompt("Copy this link:", url);
  });
  document.title = "Revenue Leak Audit · " + biz + " | ArkFlow Solutions";

  /* ---------- ArkFlow chat widget (loaded once) ---------- */
  (function () {
    var id = AF_CONFIG.chatWidgetId;
    if (!id) return;
    if (window.__afChatLoaded || document.querySelector('script[data-widget-id="' + id + '"]')) return;
    window.__afChatLoaded = true;
    var w = document.createElement("script");
    w.src = "https://widgets.leadconnectorhq.com/loader.js";
    w.setAttribute("data-resources-url", "https://widgets.leadconnectorhq.com/chat-widget/loader.js");
    w.setAttribute("data-widget-id", id);
    w.async = true;
    document.body.appendChild(w);
  })();
})();
</script>
